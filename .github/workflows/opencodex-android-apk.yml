# OpenCodex APK Builder v2
name: Build APK (YouTubeDownloader-8e3680299337b7063af73e4d9345ec229907cea7)

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & accept licenses
        uses: android-actions/setup-android@v3
        continue-on-error: true

      - name: Setup Gradle (with wrapper)
        if: hashFiles('gradlew') != ''
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Gradle (no wrapper)
        if: hashFiles('gradlew') == ''
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Grant gradlew execute permission
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Compile Kotlin & Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencodex-debug-apk
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
